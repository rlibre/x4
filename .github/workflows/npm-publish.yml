name: npm publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '2.1.0-manual'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  publish-and-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Publish to NPM
        run: |
            if [[ "${{ github.ref_name }}" == *-* ]]; then
                npm publish --access public --provenance --tag next
            else
                npm publish --access public --provenance
            fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          
      # the notes of the release: the section of its version in the changelog ("## 2.3.29 (2026-10-29)"),
      # up to the next version
      - name: Release notes from the changelog
        run: |
            awk -v v="${{ github.ref_name }}" '
                { sub( /\r$/, "" ) }
                /^## / { if( found ) exit; found = ( $0 == "## " v || index( $0, "## " v " " ) == 1 ); next }
                found
            ' changelog.md > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Generate Docs
        run: npx typedoc 

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs

